<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SuperAdmin Daily Summary</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: #fff;
      padding: 25px;
      border-radius: 12px;
    }

    h1 {
      color: #2563eb;
      margin-bottom: 10px;
    }

    h2 {
      margin-bottom: 10px;
      background: #517ddc;
      padding: 8px;
      color: white;
      display: inline-block;
      border-radius: 6px;
      font-size: 18px;
    }

    h3 {
      margin-bottom: 15px;
      color: #333;
    }

    .section {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 25px;
      overflow-x: auto;
    }

    table {
      border-collapse: collapse;
      font-size: 14px;
      width: 100%;
      min-width: 500px;
    }

    th, td {
      border: 1px solid #ddd;
      padding: 6px;
      text-align: left;
    }

    th {
      background: #f0f0f0;
    }

    .status {
      color: white;
      padding: 4px 8px;
      border-radius: 5px;
      display: inline-block;
    }

    .footer {
      color: #999;
      margin-top: 40px;
      font-size: 13px;
    }

    /* Mobile responsiveness */
    @media screen and (max-width: 600px) {
      .container {
        padding: 15px;
      }

      h2 {
        font-size: 16px;
      }

      table {
        font-size: 12px;
      }

      th, td {
        padding: 4px;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Daily Task Summary</h1>
    <h3>Date: {{date}}</h3>

      {{summary}}

    <p class="footer">
      Sent automatically by Task Tracker.
    </p>
  </div>
</body>
</html>
